<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>语音翻译助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 600;
        }

        .language-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .language-select {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background-color: white;
            color: #333;
            max-width: 45%;
        }

        .swap-languages {
            background: none;
            border: none;
            color: #667eea;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.3s ease;
        }

        .swap-languages:hover {
            transform: rotate(180deg);
        }

        .input-output-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }

        .text-box {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            min-height: 150px;
            resize: none;
            background-color: #f9f9f9;
        }

        .text-box:focus {
            outline: none;
            border-color: #667eea;
            background-color: white;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background-color: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #e0e0e0;
        }

        .recording-indicator {
            display: none;
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background-color: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
            color: #667eea;
            font-weight: 600;
        }

        .recording-indicator.active {
            display: block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .status-message {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            .language-selector {
                flex-direction: column;
                gap: 10px;
            }

            .language-select {
                max-width: 100%;
            }

            .swap-languages {
                transform: rotate(90deg);
            }

            .swap-languages:hover {
                transform: rotate(270deg);
            }

            .btn {
                padding: 10px 20px;
                font-size: 15px;
            }

            .controls {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-language"></i> 语音翻译助手</h1>

        <div class="language-selector">
            <select id="sourceLanguage" class="language-select">
                <option value="zh-CN">中文</option>
                <option value="en-US">英语</option>
                <option value="ja-JP">日语</option>
                <option value="ko-KR">韩语</option>
                <option value="fr-FR">法语</option>
                <option value="de-DE">德语</option>
                <option value="es-ES">西班牙语</option>
                <option value="ru-RU">俄语</option>
            </select>

            <button id="swapLanguages" class="swap-languages">
                <i class="fas fa-exchange-alt"></i>
            </button>

            <select id="targetLanguage" class="language-select">
                <option value="en-US">英语</option>
                <option value="zh-CN">中文</option>
                <option value="ja-JP">日语</option>
                <option value="ko-KR">韩语</option>
                <option value="fr-FR">法语</option>
                <option value="de-DE">德语</option>
                <option value="es-ES">西班牙语</option>
                <option value="ru-RU">俄语</option>
            </select>
        </div>

        <div class="input-output-container">
            <textarea id="inputText" class="text-box" placeholder="请输入要翻译的文本或点击下方按钮开始语音输入..."></textarea>
            <textarea id="outputText" class="text-box" placeholder="翻译结果将显示在这里..." readonly></textarea>
        </div>

        <div class="recording-indicator" id="recordingIndicator">
            <i class="fas fa-microphone"></i> 正在录音中...
        </div>

        <div class="controls">
            <button id="startRecognitionBtn" class="btn btn-primary">
                <i class="fas fa-microphone"></i> 语音输入
            </button>
            <button id="translateBtn" class="btn btn-secondary">
                <i class="fas fa-language"></i> 翻译
            </button>
            <button id="speakBtn" class="btn btn-secondary">
                <i class="fas fa-volume-up"></i> 播放翻译
            </button>
            <button id="clearBtn" class="btn btn-secondary">
                <i class="fas fa-trash-alt"></i> 清空
            </button>
        </div>

        <div class="status-message" id="statusMessage">
            准备就绪，请选择语言并开始翻译
        </div>
    </div>

    <script src="app_new.js"></script>
</body>
</html>
